name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name for the APK (e.g. 1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  build:
    environment: build
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: drunksettings
      KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "build-tools;36.1.0"

      - name: Resolve version
        id: version
        run: |
          raw="${{ github.event.release.tag_name || github.event.inputs.version }}"
          echo "name=${raw#v}" >> "$GITHUB_OUTPUT"

      - name: Publish libxposed to mavenLocal
        run: |
          (cd lib/libxposed/api && ./gradlew --no-daemon publishToMavenLocal)
          (cd lib/libxposed/service && ./gradlew --no-daemon publishToMavenLocal)

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ github.run_number }}"

      - name: Rename APK
        id: apk
        run: |
          src="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          out="DrunkSettings-${{ steps.version.outputs.name }}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
